services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cluer
      POSTGRES_PASSWORD: cluer_local_dev
      POSTGRES_DB: cluer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
  
      test: ["CMD-SHELL", "pg_isready -U cluer -d cluer"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"

  onboarding:
    build:
      context: .
      args:
        SERVICE: onboarding
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./deploy/onboarding.yml:/run/secrets/cluer.yml:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  demo:
    build:
      context: .
      args:
        SERVICE: demo
    volumes:
      - ./deploy/demo.yml:/run/secrets/cluer.yml:ro
    ports:
      - "8081:8080"
    restart: unless-stopped

volumes:
  pgdata:
