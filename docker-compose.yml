services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cluer
      POSTGRES_PASSWORD: cluer_local_dev
      POSTGRES_DB: cluer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
  
      test: ["CMD-SHELL", "pg_isready -U cluer -d cluer"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"

  migrate:
    build:
      context: .
      args:
        SERVICE: migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./deploy/onboarding.yml:/run/secrets/cluer.yml:ro
    restart: "no"

  onboarding:
    build:
      context: .
      args:
        SERVICE: onboarding
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./deploy/onboarding.yml:/run/secrets/cluer.yml:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  demo:
    build:
      context: .
      args:
        SERVICE: demo
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./deploy/demo.yml:/run/secrets/cluer.yml:ro
    ports:
      - "8081:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      # nginx forwards /v1 here, so the browser only ever talks to the frontend
      # origin. A runtime value: the same image works against another API
      # without a rebuild.
      API_UPSTREAM: ${API_UPSTREAM:-http://onboarding:8080}
    depends_on:
      onboarding:
        condition: service_healthy
    ports:
      - "5173:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
