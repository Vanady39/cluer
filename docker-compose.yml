services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cluer
      POSTGRES_PASSWORD: cluer_local_dev
      POSTGRES_DB: cluer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
  
      test: ["CMD-SHELL", "pg_isready -U cluer -d cluer"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"

  migrate:
    build:
      context: .
      args:
        SERVICE_PATH: ./cmd/migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./deploy/cluer.yml:/run/secrets/cluer.yml:ro
    restart: "no"

  onboarding:
    build:
      context: .
      args:
        SERVICE_PATH: ./onboarding/cmd
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./deploy/cluer.yml:/run/secrets/cluer.yml:ro
    environment:
      CLUER_OIDC_ISSUER: ${CLUER_OIDC_ISSUER:-http://auth.localhost:9000/application/o/cluer/}
      CLUER_OIDC_CLIENT_ID: ${CLUER_OIDC_CLIENT_ID:-cluer-admin}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  demo:
    build:
      context: .
      args:
        SERVICE_PATH: ./demo/cmd
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./deploy/cluer.yml:/run/secrets/cluer.yml:ro
    environment:
      CLUER_OIDC_ISSUER: ${CLUER_OIDC_ISSUER:-http://auth.localhost:9000/application/o/cluer/}
      CLUER_OIDC_CLIENT_ID: ${CLUER_OIDC_CLIENT_ID:-cluer-admin}
    ports:
      - "8081:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_OIDC_ISSUER: ${VITE_OIDC_ISSUER:-http://auth.localhost:9000/application/o/cluer/}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-cluer-admin}
        VITE_CLUER_APP_KEY: ${VITE_CLUER_APP_KEY}
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://onboarding:8080}
    depends_on:
      onboarding:
        condition: service_healthy
    ports:
      - "5173:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  authentik-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASS:?set AUTHENTIK_PG_PASS in .env}
      POSTGRES_DB: authentik
    volumes:
      - authentik-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  authentik-redis:
    image: redis:alpine
    command: --save 60 1 --loglevel warning
    volumes:
      - authentik-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2025.2.4}
    command: server
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set AUTHENTIK_SECRET_KEY in .env}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS:?set AUTHENTIK_PG_PASS in .env}
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
      - authentik-certs:/certs
      # The same file the services read. Authentik takes the version/metadata/
      # entries part and ignores the rest; the services do the opposite.
      - ./deploy/cluer.yml:/blueprints/custom/cluer.yaml:ro
    ports:
      - "9000:9000"
      - "9443:9443"
    networks:
      default:
        aliases:
          - auth.localhost
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2025.2.4}
    command: worker
    environment: *authentik-env
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
      - authentik-certs:/certs
      # The worker is what actually applies blueprints, so it needs the same
      # mount as the server.
      - ./deploy/cluer.yml:/blueprints/custom/cluer.yaml:ro
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s
    restart: unless-stopped

volumes:
  pgdata:
  authentik-pgdata:
  authentik-redis:
  authentik-media:
  authentik-templates:
  authentik-certs:
