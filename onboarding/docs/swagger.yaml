basePath: /v1
definitions:
  errs.HTTPError:
    properties:
      error:
        description: Shorthand error
        type: string
      message:
        description: Pretty error message
        type: string
    type: object
  request.Audience:
    properties:
      max_shows:
        example: 3
        type: integer
      only_new:
        example: false
        type: boolean
      rules:
        items:
          $ref: '#/definitions/request.AudienceRule'
        type: array
      show_once:
        example: true
        type: boolean
    type: object
  request.AudienceRule:
    properties:
      key:
        example: is_premium
        type: string
      operator:
        enum:
        - exists
        - not_exists
        - eq
        - neq
        - gt
        - gte
        - lt
        - lte
        - contains
        - not_contains
        - starts_with
        - ends_with
        example: eq
        type: string
      timeframe:
        enum:
        - 1h
        - 24h
        - 7d
        - 30d
        - all_time
        example: 7d
        type: string
      type:
        enum:
        - event_performed
        - page_visited
        - user_property
        example: page_visited
        type: string
      value: {}
    type: object
  request.CreateAppRequest:
    properties:
      allowed_origins:
        items:
          type: string
        type: array
      name:
        type: string
    required:
    - name
    type: object
  request.DraftPatch:
    properties:
      audience:
        $ref: '#/definitions/request.Audience'
      target_path:
        type: string
      trigger_config:
        $ref: '#/definitions/request.TriggerConfig'
      trigger_type:
        type: string
    type: object
  request.EventBatchRequest:
    properties:
      events:
        items:
          $ref: '#/definitions/request.EventItem'
        type: array
      session_id:
        type: string
      subject_id:
        type: string
    required:
    - events
    - session_id
    - subject_id
    type: object
  request.EventItem:
    properties:
      event_key:
        type: string
      hint_id:
        type: string
      occurred_at:
        type: string
      payload:
        additionalProperties: {}
        type: object
      tour_id:
        type: string
      tour_version_id:
        type: string
      type:
        enum:
        - tour_started
        - hint_shown
        - hint_completed
        - hint_skipped
        - selector_missing
        - tour_completed
        - tour_dismissed
        - goal_reached
        - custom
        type: string
    required:
    - event_key
    - type
    type: object
  request.Hint:
    properties:
      content:
        example: Здесь вы можете изменить параметры аккаунта
        type: string
      created_at:
        format: date-time
        type: string
      expected_input:
        example: John Doe
        type: string
      id:
        format: uuid
        type: string
      input_placeholder:
        example: Введите ваше имя
        type: string
      media_url:
        example: https://cdn.example.com/onboarding/settings.mp4
        type: string
      page_path:
        description: |-
          Пусто — подсказка живёт на той же странице, где тур стартовал,
          то есть наследует target_path версии.
        example: /dashboard
        type: string
      placement:
        enum:
        - top
        - bottom
        - center
        - left-top
        - right-top
        - left
        - right
        example: bottom
        type: string
      required:
        example: false
        type: boolean
      selector:
        example: '#settings-btn'
        type: string
      spotlight:
        example: true
        type: boolean
      step:
        example: 1
        type: integer
      title:
        example: Нажмите кнопку настроек
        type: string
      tour_version_id:
        format: uuid
        type: string
      updated_at:
        format: date-time
        type: string
      wait_for_selector:
        example: true
        type: boolean
    type: object
  request.ReorderRequest:
    properties:
      hint_ids:
        items:
          type: string
        type: array
    required:
    - hint_ids
    type: object
  request.ResolveRequest:
    properties:
      props:
        additionalProperties: {}
        type: object
      session_id:
        type: string
      subject_id:
        type: string
      url:
        type: string
    required:
    - subject_id
    type: object
  request.RollbackRequest:
    properties:
      to_version_id:
        type: string
    required:
    - to_version_id
    type: object
  request.Tour:
    properties:
      app_id:
        format: uuid
        type: string
      audience:
        $ref: '#/definitions/request.Audience'
      created_at:
        format: date-time
        type: string
      description:
        example: Тур по основным функциям дашборда
        type: string
      enabled:
        example: true
        type: boolean
      hints:
        items:
          $ref: '#/definitions/request.Hint'
        type: array
      id:
        format: uuid
        type: string
      priority:
        example: 1
        type: integer
      status:
        enum:
        - draft
        - published
        - archived
        example: draft
        type: string
      target_path:
        example: /dashboard
        type: string
      title:
        example: Добро пожаловать в систему
        type: string
      trigger_config:
        $ref: '#/definitions/request.TriggerConfig'
      trigger_type:
        enum:
        - on_load
        - delay
        - exit_intent
        - manual
        - scroll_depth
        - inactivity
        - element_visible
        example: on_load
        type: string
      updated_at:
        format: date-time
        type: string
      version:
        example: 7
        type: integer
      version_id:
        format: uuid
        type: string
    type: object
  request.TourMetaPatch:
    properties:
      description:
        type: string
      enabled:
        type: boolean
      priority:
        type: integer
      title:
        type: string
    type: object
  request.TriggerConfig:
    properties:
      delay_ms:
        example: 1500
        type: integer
      element_selector:
        type: string
      inactivity_secs:
        example: 30
        type: integer
      scroll_depth:
        example: 50
        type: integer
    type: object
  response.Analytics:
    properties:
      broken_selectors:
        items:
          type: string
        type: array
      from:
        format: date-time
        type: string
      funnel:
        items:
          $ref: '#/definitions/response.FunnelStep'
        type: array
      to:
        format: date-time
        type: string
      totals:
        $ref: '#/definitions/response.AnalyticsTotals'
      tour_id:
        format: uuid
        type: string
      tour_version_id:
        format: uuid
        type: string
      version:
        example: 7
        type: integer
    type: object
  response.AnalyticsTotals:
    properties:
      completed:
        example: 612
        type: integer
      completion_rate:
        example: 0.494
        type: number
      dismissed:
        example: 388
        type: integer
      goal_rate:
        example: 0.404
        type: number
      goal_reached:
        example: 501
        type: integer
      started:
        example: 1240
        type: integer
    type: object
  response.App:
    properties:
      allowed_origins:
        example:
        - http://localhost:3000
        items:
          type: string
        type: array
      archived_at:
        format: date-time
        type: string
      created_at:
        format: date-time
        type: string
      id:
        format: uuid
        type: string
      name:
        example: Demo classifieds
        type: string
      public_key:
        example: pk_demo_7f3a91c4b2e85d60
        type: string
    type: object
  response.Audience:
    properties:
      max_shows:
        example: 3
        type: integer
      only_new:
        example: false
        type: boolean
      rules:
        items:
          $ref: '#/definitions/response.AudienceRule'
        type: array
      show_once:
        example: true
        type: boolean
    type: object
  response.AudienceRule:
    properties:
      key:
        example: is_premium
        type: string
      operator:
        enum:
        - exists
        - not_exists
        - eq
        - neq
        - gt
        - gte
        - lt
        - lte
        - contains
        - not_contains
        - starts_with
        - ends_with
        example: eq
        type: string
      timeframe:
        enum:
        - 1h
        - 24h
        - 7d
        - 30d
        - all_time
        example: 7d
        type: string
      type:
        enum:
        - event_performed
        - page_visited
        - user_property
        example: page_visited
        type: string
      value: {}
    type: object
  response.CurrentAdmin:
    properties:
      email:
        type: string
      groups:
        items:
          type: string
        type: array
      name:
        type: string
      subject:
        type: string
      username:
        type: string
    type: object
  response.EventBatchResult:
    properties:
      accepted:
        example: 4
        type: integer
      duplicates:
        example: 1
        type: integer
      errors:
        items:
          type: string
        type: array
      rejected:
        example: 0
        type: integer
    type: object
  response.FunnelStep:
    properties:
      completed:
        example: 1105
        type: integer
      dropoff:
        example: 0.109
        type: number
      hint_id:
        format: uuid
        type: string
      selector_missing:
        example: 0
        type: integer
      shown:
        example: 1240
        type: integer
      skipped:
        example: 0
        type: integer
      step:
        example: 1
        type: integer
      title:
        example: Начните здесь
        type: string
    type: object
  response.GetCurrentAdminResponse:
    properties:
      data:
        $ref: '#/definitions/response.CurrentAdmin'
    type: object
  response.Health:
    properties:
      db:
        example: ok
        type: string
      status:
        example: ok
        type: string
    type: object
  response.Hint:
    properties:
      content:
        example: Здесь вы можете изменить параметры аккаунта
        type: string
      created_at:
        format: date-time
        type: string
      expected_input:
        example: John Doe
        type: string
      id:
        example: 01914f6a-8c9b-7a0b-9b0b-8c9b7a0b9b0c
        format: uuid
        type: string
      input_placeholder:
        example: Введите ваше имя
        type: string
      media_url:
        example: https://cdn.example.com/onboarding/settings.mp4
        type: string
      page_path:
        description: |-
          Пусто — подсказка живёт на той же странице, где тур стартовал,
          то есть наследует target_path версии.
        example: /dashboard
        type: string
      placement:
        enum:
        - top
        - bottom
        - center
        - left-top
        - right-top
        - left
        - right
        example: bottom
        type: string
      required:
        example: false
        type: boolean
      selector:
        example: '#settings-btn'
        type: string
      spotlight:
        example: true
        type: boolean
      step:
        example: 1
        type: integer
      title:
        example: Нажмите кнопку настроек
        type: string
      tour_version_id:
        format: uuid
        type: string
      updated_at:
        format: date-time
        type: string
      wait_for_selector:
        example: true
        type: boolean
    type: object
  response.ResolveResult:
    properties:
      current_hint_id:
        format: uuid
        type: string
      tour:
        $ref: '#/definitions/response.Tour'
      tour_version_id:
        format: uuid
        type: string
      version:
        example: 7
        type: integer
    type: object
  response.Tour:
    properties:
      app_id:
        format: uuid
        type: string
      audience:
        $ref: '#/definitions/response.Audience'
      created_at:
        format: date-time
        type: string
      description:
        example: Тур по основным функциям дашборда
        type: string
      enabled:
        example: true
        type: boolean
      hints:
        items:
          $ref: '#/definitions/response.Hint'
        type: array
      id:
        example: 01914f6a-8c9b-7a0b-9b0b-8c9b7a0b9b0b
        format: uuid
        type: string
      priority:
        example: 1
        type: integer
      status:
        enum:
        - draft
        - published
        - archived
        example: draft
        type: string
      target_path:
        example: /dashboard
        type: string
      title:
        example: Добро пожаловать в систему
        type: string
      trigger_config:
        $ref: '#/definitions/response.TriggerConfig'
      trigger_type:
        enum:
        - on_load
        - delay
        - exit_intent
        - manual
        - scroll_depth
        - inactivity
        - element_visible
        example: on_load
        type: string
      updated_at:
        format: date-time
        type: string
      version:
        example: 7
        type: integer
      version_id:
        format: uuid
        type: string
    type: object
  response.TourCard:
    properties:
      draft:
        $ref: '#/definitions/response.TourVersion'
      published:
        $ref: '#/definitions/response.TourVersion'
      tour:
        $ref: '#/definitions/response.Tour'
    type: object
  response.TourVersion:
    properties:
      archived_at:
        format: date-time
        type: string
      audience:
        $ref: '#/definitions/response.Audience'
      created_at:
        format: date-time
        type: string
      created_by:
        type: string
      hints:
        items:
          $ref: '#/definitions/response.Hint'
        type: array
      id:
        format: uuid
        type: string
      published_at:
        format: date-time
        type: string
      status:
        enum:
        - draft
        - published
        - archived
        example: published
        type: string
      target_path:
        example: /dashboard
        type: string
      tour_id:
        format: uuid
        type: string
      trigger_config:
        $ref: '#/definitions/response.TriggerConfig'
      trigger_type:
        enum:
        - on_load
        - delay
        - exit_intent
        - manual
        - scroll_depth
        - inactivity
