      element_selector:
        type: string
      inactivity_secs:
        example: 30
        type: integer
      scroll_depth:
        example: 50
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: 'Interactive onboarding platform: tours, immutable versions, resolve
    and analytics.'
  title: Cluer Onboarding
  version: 0.1.0
paths:
  /apps:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/response.App'
            type: array
      summary: List consumer applications
      tags:
      - Apps
    post:
      consumes:
      - application/json
      description: Issues the public key that goes into the SDK script tag
      parameters:
      - description: Application
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.CreateAppRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.App'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errs.HTTPError'
      summary: Register a consumer application
      tags:
      - Apps
  /events:
    post:
      consumes:
      - application/json
      description: Idempotent on event_key, so a retry after a dropped connection
        cannot double the metrics
      parameters:
      - description: Application public key
        in: header
        name: X-App-Key
        required: true
        type: string
      - description: Event batch
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.EventBatchRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/response.EventBatchResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errs.HTTPError'
      summary: Accept a batch of events
      tags:
      - Runtime
  /health:
    get:
      description: Reports whether the process and its database are both usable
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Health'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Health'
      summary: Health check
      tags:
      - Runtime
  /resolve:
    post:
      consumes:
      - application/json
      description: The single request the SDK makes on init. Returns at most one tour,
        whole.
      parameters:
      - description: Application public key
        in: header
        name: X-App-Key
        required: true
        type: string
      - description: Resolve context
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.ResolveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ResolveResult'
        "204":
          description: Nothing to show
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errs.HTTPError'
      summary: Resolve a tour for a subject
      tags:
      - Runtime
  /tours:
    get:
      description: Returns every tour of an app with the status of its current version
      parameters:
      - description: App ID
        format: uuid
        in: query
        name: appId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/response.Tour'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errs.HTTPError'
      summary: List tours
      tags:
      - Tours
    post:
      consumes:
      - application/json
      description: Creates a tour together with its first draft version
      parameters:
      - description: App ID
        format: uuid
        in: query
        name: appId
        required: true
        type: string
      - description: Tour object
        in: body
        name: tour
        required: true
        schema:
          $ref: '#/definitions/request.Tour'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Tour'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errs.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errs.HTTPError'
      summary: Create a new tour
      tags:
      - Tours
  /tours/{tourId}:
    delete:
      description: 'Soft delete: the tour stops resolving but its analytics history
        survives'
      parameters:
      - description: Tour ID
        format: uuid
        in: path
        name: tourId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errs.HTTPError'
      summary: Archive a tour
      tags:
      - Tours
    get:
      description: Returns the tour with both its published and draft versions
      parameters:
      - description: Tour ID
        format: uuid
        in: path
        name: tourId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.TourCard'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errs.HTTPError'
      summary: Get a tour card
      tags:
      - Tours
    patch:
      consumes:
      - application/json
      description: Changes title, description, enabled or priority without creating
        a version
      parameters:
      - description: Tour ID
        format: uuid
        in: path
        name: tourId
        required: true
        type: string
      - description: Fields to change
        in: body
        name: patch
        required: true
        schema:
          $ref: '#/definitions/request.TourMetaPatch'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Tour'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errs.HTTPError'
      summary: Update tour metadata
      tags:
      - Tours
  /tours/{tourId}/analytics:
    get:
      description: Per-hint funnel for one version over one period
      parameters:
      - description: Tour ID
        format: uuid
        in: path
        name: tourId
        required: true
        type: string
      - description: Version ID, defaults to published
        format: uuid
        in: query
        name: versionId
        type: string
      - description: Period start, RFC3339
        in: query
        name: from
        type: string
      - description: Period end, RFC3339
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Analytics'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errs.HTTPError'
      summary: Tour funnel and totals
      tags:
      - Analytics
  /tours/{tourId}/draft:
    patch:
      consumes:
      - application/json
      description: Saves work in progress; validation is enforced at publish time,
        not here
      parameters:
      - description: Tour ID
        format: uuid
        in: path
        name: tourId
        required: true
        type: string
      - description: Fields to change
        in: body
        name: patch
        required: true
        schema:
          $ref: '#/definitions/request.DraftPatch'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.TourVersion'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/errs.HTTPError'
      summary: Update the draft content
      tags:
      - Versions
    post:
      description: 'Entry point to editing: the published version itself is never
        modified'
      parameters:
      - description: Tour ID
        format: uuid
        in: path
        name: tourId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.TourVersion'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/errs.HTTPError'
      summary: Fork a draft from the published version
      tags:
      - Versions
  /tours/{tourId}/hints:
    get:
      description: Returns the hints of the tour's draft version, ordered by step
      parameters:
      - description: Tour ID
        format: uuid
        in: path
        name: tourId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/response.Hint'
            type: array
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/errs.HTTPError'
      summary: List draft hints
      tags:
      - Hints
    post:
      consumes:
      - application/json
      description: Appends a hint to the tour's draft version
      parameters:
      - description: Tour ID
        format: uuid
        in: path
        name: tourId
        required: true
        type: string
      - description: Hint object
        in: body
        name: hint
        required: true
        schema:
          $ref: '#/definitions/request.Hint'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Hint'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errs.HTTPError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/errs.HTTPError'
      summary: Create a hint
      tags:
      - Hints
  /tours/{tourId}/hints/{hintId}:
    delete:
      description: Removes a hint from the draft and closes the gap in step numbering
      parameters:
      - description: Tour ID
        format: uuid
        in: path
        name: tourId
        required: true
        type: string
      - description: Hint ID
        format: uuid
        in: path
        name: hintId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errs.HTTPError'
      summary: Delete a hint
      tags:
      - Hints
    patch:
      consumes:
      - application/json
      description: Edits a hint of the draft version; hints of published versions
        are immutable
      parameters:
      - description: Tour ID
        format: uuid
        in: path
        name: tourId
        required: true
        type: string
      - description: Hint ID
        format: uuid
        in: path
        name: hintId
        required: true
        type: string
      - description: Hint object
        in: body
        name: hint
        required: true
        schema:
          $ref: '#/definitions/request.Hint'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Hint'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/errs.HTTPError'
      summary: Update a hint
      tags:
      - Hints
  /tours/{tourId}/hints/order:
    put:
      consumes:
      - application/json
      description: Takes the full list of hint ids in their new order
      parameters:
      - description: Tour ID
        format: uuid
        in: path
        name: tourId
        required: true
        type: string
      - description: Ordered hint ids
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.ReorderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/response.Hint'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errs.HTTPError'
      summary: Reorder hints
      tags:
      - Hints
  /tours/{tourId}/publish:
    post:
      description: Archives the live version and promotes the draft, atomically
      parameters:
      - description: Tour ID
        format: uuid
        in: path
        name: tourId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.TourVersion'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/errs.HTTPError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/errs.HTTPError'
      summary: Publish the draft
      tags:
      - Versions
  /tours/{tourId}/rollback:
    post:
      consumes:
      - application/json
      description: Copies the chosen version into a new one and publishes it; history
        is appended, never rewritten
      parameters:
      - description: Tour ID
        format: uuid
        in: path
        name: tourId
        required: true
        type: string
      - description: Target version
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.RollbackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.TourVersion'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/errs.HTTPError'
      summary: Roll back to an earlier version
      tags:
      - Versions
  /tours/{tourId}/versions:
    get:
      description: Version history without hint bodies, newest first
      parameters:
      - description: Tour ID
        format: uuid
        in: path
        name: tourId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/response.TourVersion'
            type: array
      summary: List tour versions
      tags:
      - Versions
  /tours/published:
    get:
      description: Returns published tours with their hints for a target path
      parameters:
      - description: App ID
        format: uuid
        in: query
        name: appId
        required: true
        type: string
      - description: Target path
        example: /dashboard
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/response.Tour'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errs.HTTPError'
      summary: Get published tours by path
      tags:
      - Tours
  /users/me:
    get:
      description: 'Returns the identity behind the presented id token: subject, profile
        fields and IdP groups.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.GetCurrentAdminResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errs.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/errs.HTTPError'
      security:
      - Bearer: []
      summary: Get the current administrator
      tags:
      - Users
  /versions/{versionId}:
    get:
      description: Returns a version with its hints, for diffing and preview
      parameters:
      - description: Version ID
        format: uuid
        in: path
        name: versionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.TourVersion'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errs.HTTPError'
      summary: Get one version
      tags:
      - Versions
securityDefinitions:
  Bearer:
    description: 'OIDC id token: "Bearer <id_token>".'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
