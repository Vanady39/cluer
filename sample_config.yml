# Шаблон конфигурации. Единственный конфиг, который читают сервисы, — это
# deploy/cluer.yml: он не в репозитории (.gitignore), потому что несёт реальные
# пароли и issuer. Начать работу — скопировать этот файл и заполнить:
#
#   cp sample_config.yml deploy/cluer.yml
#
# Файл читают две разные системы, и каждая берёт только свою часть, игнорируя
# чужие ключи:
#
#   Go-сервисы     секции server/postgres/oidc/logger. docker-compose монтирует
#   (migrate,      файл каждому контейнеру как /run/secrets/cluer.yml.
#    onboarding,
#    demo)
#
#   Authentik      секции version/metadata/entries — это blueprint, описание
#                  состояния провайдера. Монтируется в контейнеры authentik как
#                  /blueprints/custom/cluer.yaml и применяется при старте.
#
# Значения секций сервисов перекрываются переменными окружения с префиксом
# CLUER_: точка в пути ключа становится подчёркиванием. postgres.address ->
# CLUER_POSTGRES_ADDRESS, oidc.issuer -> CLUER_OIDC_ISSUER. Это и есть способ
# запустить сервис с хоста, где база доступна не по имени контейнера:
#
#   CLUER_CONFIG_PATH=./deploy CLUER_POSTGRES_ADDRESS=127.0.0.1:5432 \
#     go run ./onboarding/cmd

# ------------------------------------------------------- blueprint Authentik
# Приводит Authentik в состояние, которого ждут сервисы: группа админов,
# публичный OAuth2-провайдер и приложение со слагом cluer. Повторное применение
# идемпотентно, так что редактировать этот блок можно свободно.
#
# client_id ниже должен совпадать с oidc.client_id, имя группы — с одним из
# oidc.admin_groups, иначе токен пройдёт проверку подписи, но не даст доступа к
# админскому API.
#
# redirect_uris — адрес, куда Authentik возвращает браузер после логина. Для
# другого домена или порта фронтенда его нужно поменять здесь же.
version: 1
metadata:
  name: cluer

entries:
  - model: authentik_core.group
    identifiers:
      name: cluer-admins
    attrs:
      is_superuser: false

  - model: authentik_providers_oauth2.oauth2provider
    id: cluer-provider
    identifiers:
      name: cluer
    attrs:
      client_type: public
      client_id: cluer-admin
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:5173/callback

  - model: authentik_core.application
    identifiers:
      slug: cluer
    attrs:
      name: Cluer
      provider: !KeyOf cluer-provider

# ---------------------------------------------------------- конфиг сервисов
server:
  address: 0.0.0.0:8080

# Требуется всем трём бинарникам: без этой секции migrate, onboarding и demo
# останавливаются на старте. address — адрес в сети docker-compose; с хоста
# перекрывается через CLUER_POSTGRES_ADDRESS.
postgres:
  address: postgres:5432
  user: cluer
  password: ЗАПОЛНИТЬ
  dbname: cluer
  sslmode: disable

# Аутентификация. Сервис запрашивает discovery-документ при старте и не
# поднимется, пока issuer не ответит.
#
# issuer       Authentik -> Applications -> Providers -> cluer, "OpenID
#              Configuration Issuer". Вид: https://<host>/application/o/<slug>/
#              Копировать дословно: завершающий слэш — часть значения, оно
#              сравнивается побайтово с полем `iss` в токене. Значение ниже
#              соответствует Authentik из docker-compose.yml.
# client_id    Не секрет: фронтенд — публичный PKCE-клиент, хранить ему нечего.
#              Должен совпадать с `aud` предъявляемых токенов и с client_id в
#              blueprint выше.
# admin_groups Любая из этих групп открывает весь админский API. Группа должна
#              доезжать до токена как claim `groups`. Читает только onboarding:
#              витрина спрашивает лишь «залогинен ли посетитель», и лента
#              объявлений остаётся публичной.
oidc:
  issuer: http://auth.localhost:9000/application/o/cluer/
  client_id: cluer-admin
  admin_groups:
    - cluer-admins

logger:
  default:
    level: info
  modules:
    server:
      level: debug
