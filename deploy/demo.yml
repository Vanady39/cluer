server:
  address: 0.0.0.0:8080

postgres:
  address: postgres:5432
  user: cluer
  password: cluer_local_dev
  dbname: cluer
  sslmode: disable

# Authentication of GET /v1/users/me. These are placeholders: this file is in
# the repository, so the real values belong in a mounted secret or an override
# that .gitignore keeps out. The service fetches the discovery document at boot
# and will not start until the issuer answers.
#
# issuer must be copied from Authentik verbatim, trailing slash included, and
# client_id must match the `aud` of the tokens the storefront presents. Both
# repeat the values in deploy/onboarding.yml on purpose: the frontend is one
# application with one OIDC client, so the same id token has to be accepted by
# both services. Register a separate client for the storefront and this
# client_id changes with it.
#
# There is no admin_groups here and there should not be: the storefront asks
# only whether the visitor is authenticated, never which groups they hold. The
# listings feed stays public — only /v1/users/me requires a token.
oidc:
  issuer: https://auth.example.com/application/o/cluer/
  client_id: cluer-admin

logger:
  default:
    level: info
  modules:
    server:
      level: debug
