server:
  address: 0.0.0.0:8080

postgres:
  address: postgres:5432
  user: cluer
  password: cluer_local_dev
  dbname: cluer
  sslmode: disable

# Authentication of the admin API. These are placeholders: this file is in the
# repository, so the real values belong in a mounted secret or an override that
# .gitignore keeps out. The service fetches the discovery document at boot and
# will not start until the issuer answers.
#
# issuer must be copied from Authentik verbatim, trailing slash included, and
# every name under admin_groups must reach the token as a `groups` claim.
oidc:
  issuer: https://auth.example.com/application/o/cluer/
  client_id: cluer-admin
  admin_groups:
    - cluer-admins

logger:
  default:
    level: info
  modules:
    server:
      level: debug
