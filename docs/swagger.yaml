host: localhost:8080
info:
  contact: {}
  description: 'Interactive onboarding platform: tours, immutable versions, resolve
    and analytics.'
  title: Cluer Onboarding
  version: 0.1.0
paths:
  /apps:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.App'
            type: array
      summary: List consumer applications
      tags:
      - Apps
    post:
      consumes:
      - application/json
      description: Issues the public key that goes into the SDK script tag
      parameters:
      - description: Application
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_controllers.CreateAppRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.App'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_models.HTTPError'
      summary: Register a consumer application
      tags:
      - Apps
  /events:
    post:
      consumes:
      - application/json
      description: Idempotent on event_key, so a retry after a dropped connection
        cannot double the metrics
      parameters:
      - description: Application public key
        in: header
        name: X-App-Key
        required: true
        type: string
      - description: Event batch
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_controllers.EventBatchRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.EventBatchResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_models.HTTPError'
      summary: Accept a batch of events
      tags:
      - Runtime
  /health:
    get:
      description: Reports whether the process and its database are both usable
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_controllers.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_controllers.HealthResponse'
      summary: Health check
      tags:
      - Runtime
  /listings:
    get:
      description: Returns every available listing
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_models_response.GetListingsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_models.HTTPError'
      summary: Get all listings
      tags:
      - Listings
  /resolve:
    post:
      consumes:
      - application/json
      description: The single request the SDK makes on init. Returns at most one tour,
        whole.
      parameters:
      - description: Application public key
        in: header
        name: X-App-Key
        required: true
        type: string
      - description: Resolve context
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_controllers.ResolveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.ResolveResult'
        "204":
          description: Nothing to show
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_models.HTTPError'
      summary: Resolve a tour for a subject
      tags:
      - Runtime
  /tours:
    get:
      description: Returns every tour of an app with the status of its current version
      parameters:
      - description: App ID
        format: uuid
        in: query
        name: appId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.Tour'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_models.HTTPError'
      summary: List tours
      tags:
      - Tours
    post:
      consumes:
      - application/json
      description: Creates a tour together with its first draft version
      parameters:
      - description: App ID
        format: uuid
        in: query
        name: appId
        required: true
        type: string
      - description: Tour object
        in: body
        name: tour
        required: true
        schema:
          $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.Tour'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.Tour'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_models.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_models.HTTPError'
      summary: Create a new tour
      tags:
      - Tours
  /tours/{tourId}:
    delete:
      description: 'Soft delete: the tour stops resolving but its analytics history
        survives'
      parameters:
      - description: Tour ID
        format: uuid
        in: path
        name: tourId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_models.HTTPError'
      summary: Archive a tour
      tags:
      - Tours
    get:
      description: Returns the tour with both its published and draft versions
      parameters:
      - description: Tour ID
        format: uuid
        in: path
        name: tourId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.TourCard'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_models.HTTPError'
      summary: Get a tour card
      tags:
      - Tours
    patch:
      consumes:
      - application/json
      description: Changes title, description, enabled or priority without creating
        a version
      parameters:
      - description: Tour ID
        format: uuid
        in: path
        name: tourId
        required: true
        type: string
      - description: Fields to change
        in: body
        name: patch
        required: true
        schema:
          $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.TourMetaPatch'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.Tour'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_models.HTTPError'
      summary: Update tour metadata
      tags:
      - Tours
  /tours/{tourId}/analytics:
    get:
      description: Per-hint funnel for one version over one period
      parameters:
      - description: Tour ID
        format: uuid
        in: path
        name: tourId
        required: true
        type: string
      - description: Version ID, defaults to published
        format: uuid
        in: query
        name: versionId
        type: string
      - description: Period start, RFC3339
        in: query
        name: from
        type: string
      - description: Period end, RFC3339
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.Analytics'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_models.HTTPError'
      summary: Tour funnel and totals
      tags:
      - Analytics
  /tours/{tourId}/draft:
    patch:
      consumes:
      - application/json
      description: Saves work in progress; validation is enforced at publish time,
        not here
      parameters:
      - description: Tour ID
        format: uuid
        in: path
        name: tourId
        required: true
        type: string
      - description: Fields to change
        in: body
        name: patch
        required: true
        schema:
          $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.DraftPatch'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.TourVersion'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_models.HTTPError'
      summary: Update the draft content
      tags:
      - Versions
    post:
      description: 'Entry point to editing: the published version itself is never
        modified'
      parameters:
      - description: Tour ID
        format: uuid
        in: path
        name: tourId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.TourVersion'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_models.HTTPError'
      summary: Fork a draft from the published version
      tags:
      - Versions
  /tours/{tourId}/hints:
    get:
      description: Returns the hints of the tour's draft version, ordered by step
      parameters:
      - description: Tour ID
        format: uuid
        in: path
        name: tourId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
