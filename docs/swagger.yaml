        type: boolean
      hints:
        items:
          $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.Hint'
        type: array
      id:
        example: 01914f6a-8c9b-7a0b-9b0b-8c9b7a0b9b0b
        format: uuid
        type: string
      priority:
        example: 1
        type: integer
      status:
        allOf:
        - $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.TourStatus'
        example: draft
      target_path:
        example: /dashboard
        type: string
      title:
