      id:
        example: 01914f6a-8c9b-7a0b-9b0b-8c9b7a0b9b0c
        format: uuid
        type: string
      input_placeholder:
        example: Введите ваше имя
        type: string
      media_url:
        example: https://cdn.example.com/onboarding/settings.mp4
