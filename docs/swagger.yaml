      only_new:
        example: false
        type: boolean
      rules:
        items:
          $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.AudienceRule'
        type: array
      show_once:
        example: true
        type: boolean
    type: object
  github_com_Vanady39_cluer_internal_domains.AudienceRule:
    properties:
      key:
        example: is_premium
        type: string
      operator:
        enum:
        - exists
        - not_exists
        - eq
        - neq
        - gt
        - gte
        - lt
        - lte
        - contains
        - not_contains
        - starts_with
        - ends_with
        example: eq
        type: string
      timeframe:
        enum:
        - 1h
        - 24h
        - 7d
        - 30d
        - all_time
        example: 7d
        type: string
      type:
        enum:
        - event_performed
        - page_visited
        - user_property
        example: page_visited
        type: string
      value: {}
    type: object
  github_com_Vanady39_cluer_internal_domains.DraftPatch:
    properties:
      audience:
        $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.Audience'
      target_path:
