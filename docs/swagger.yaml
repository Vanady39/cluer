host: localhost:8080
info:
  contact: {}
  description: Onboarding tours and listings API.
  title: Cluer
  version: 0.0.1
paths:
  /listings:
    get:
      description: Returns every available listing
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_models_response.GetListingsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_models.HTTPError'
      summary: Get all listings
      tags:
      - Listings
  /tours:
    post:
      consumes:
      - application/json
      description: Creates a new onboarding tour draft
      parameters:
      - description: Tour object
        in: body
        name: tour
        required: true
        schema:
          $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.Tour'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_models.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_models.HTTPError'
      summary: Create a new tour
      tags:
      - Tours
  /tours/{tourId}/hints:
    post:
      consumes:
      - application/json
      description: Creates a new hint for a specific tour
      parameters:
      - description: Tour ID
        format: uuid
        in: path
        name: tourId
        required: true
        type: string
      - description: Hint object
        in: body
        name: hint
        required: true
        schema:
          $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.Hint'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_models.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_models.HTTPError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_models.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_models.HTTPError'
      summary: Create a hint for a tour
      tags:
      - Hints
  /tours/published:
    get:
      description: Returns published tours with their hints for a specific target
        path
      parameters:
      - description: Target path
        example: /dashboard
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.Tour'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_models.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_models.HTTPError'
      summary: Get published tours by path
      tags:
      - Tours
  /users/me:
    get:
      description: Returns the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_models_response.GetCurrentUserResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_Vanady39_cluer_internal_models.HTTPError'
      summary: Get the current user
      tags:
      - Users
swagger: "2.0"
