      created_by:
        type: string
      hints:
        items:
          $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.Hint'
        type: array
      id:
        format: uuid
        type: string
      published_at:
        format: date-time
        type: string
      status:
        allOf:
        - $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.TourStatus'
        example: published
      target_path:
