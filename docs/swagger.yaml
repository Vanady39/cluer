      trigger_config:
        $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.TriggerConfig'
      trigger_type:
        $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.TriggerType'
    type: object
  github_com_Vanady39_cluer_internal_domains.EventBatchResult:
    properties:
      accepted:
        example: 4
        type: integer
      duplicates:
        example: 1
        type: integer
      errors:
        items:
          type: string
        type: array
      rejected:
        example: 0
        type: integer
    type: object
  github_com_Vanady39_cluer_internal_domains.EventType:
    enum:
    - tour_started
    - hint_shown
    - hint_completed
    - hint_skipped
    - selector_missing
    - tour_completed
    - tour_dismissed
    - goal_reached
    - custom
    type: string
    x-enum-varnames:
    - EventTourStarted
    - EventHintShown
    - EventHintCompleted
    - EventHintSkipped
    - EventSelectorMissing
    - EventTourCompleted
    - EventTourDismissed
    - EventGoalReached
