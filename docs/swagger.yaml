        type: string
      trigger_config:
        $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.TriggerConfig'
      trigger_type:
        allOf:
        - $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.TriggerType'
        example: on_load
      updated_at:
        format: date-time
        type: string
      version:
