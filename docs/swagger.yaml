        example: /dashboard
        type: string
      placement:
        allOf:
        - $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.Placement'
        example: bottom
      required:
        example: false
        type: boolean
      selector:
        example: '#settings-btn'
        type: string
      spotlight:
        example: true
        type: boolean
      step:
        example: 1
        type: integer
      title:
        example: Нажмите кнопку настроек
        type: string
      tour_version_id:
        format: uuid
        type: string
      updated_at:
        format: date-time
        type: string
      wait_for_selector:
        example: true
        type: boolean
    type: object
  github_com_Vanady39_cluer_internal_domains.Placement:
    enum:
    - top
