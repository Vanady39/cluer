basePath: /v1
definitions:
  github_com_Vanady39_cluer_internal_domains.Analytics:
    properties:
      broken_selectors:
        items:
          type: string
        type: array
      from:
        format: date-time
        type: string
      funnel:
        items:
          $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.FunnelStep'
        type: array
      to:
        format: date-time
        type: string
      totals:
        $ref: '#/definitions/github_com_Vanady39_cluer_internal_domains.AnalyticsTotals'
      tour_id:
        format: uuid
        type: string
      tour_version_id:
        format: uuid
        type: string
      version:
        example: 7
        type: integer
    type: object
  github_com_Vanady39_cluer_internal_domains.AnalyticsTotals:
    properties:
      completed:
        example: 612
        type: integer
      completion_rate:
        example: 0.494
        type: number
      dismissed:
        example: 388
        type: integer
      goal_rate:
        example: 0.404
        type: number
      goal_reached:
        example: 501
        type: integer
      started:
        example: 1240
        type: integer
    type: object
  github_com_Vanady39_cluer_internal_domains.App:
    properties:
      allowed_origins:
        example:
        - http://localhost:3000
        items:
          type: string
        type: array
      archived_at:
        format: date-time
        type: string
      created_at:
        format: date-time
        type: string
